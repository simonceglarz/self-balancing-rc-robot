; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Pinned to the SAME platform version as the robot project — this matters
; for ESP-NOW specifically, since callback signatures changed between
; arduino-esp32 core versions. Keeping both boards on identical cores
; avoids signature-mismatch compile errors on one side but not the other.
[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.03/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200

; No lib_deps needed — esp_now, esp_wifi, and WiFi are all built into the
; arduino-esp32 core itself, not separate libraries to fetch.
